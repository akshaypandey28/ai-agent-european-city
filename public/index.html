<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>European Travel Dining Agent</title>
    
    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Marked.js library for converting AI Markdown to clean HTML -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

    <div id="chat-wrapper">
        <header class="header">
            European Travel Dining Agent
        </header>
        
        <main id="chat-box">
            <!-- Initial AI Welcome Message -->
            <div class="message ai-message">
                Hello! I am your AI Dining Agent. Which European city are you planning to visit?
            </div>
        </main>

        <footer id="input-area">
            <input type="text" id="user-input" placeholder="Type your response..." />
            <button id="send-btn">Send</button>
        </footer>
    </div>

    <!-- External JavaScript -->
    <script src="script.js"></script>
</body>
</html>
